services:
  gmail-sorter:
    build: .
    container_name: gmail-sorter

    restart: unless-stopped

    env_file:
      - .env

    environment:
      APP_PORT: ${APP_PORT:-8000}
      VIRTUAL_HOST: ${APP_DOMAIN}
      VIRTUAL_PORT: ${APP_PORT:-8000}
      LETSENCRYPT_HOST: ${APP_DOMAIN}
      LETSENCRYPT_EMAIL: ${LETSENCRYPT_EMAIL}

    volumes:
      - ./data:/app/data
      - ./token.json:/app/token.json
    
    networks:
      - ai_platform

networks:
  ai_platform:
    external: true